<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Thallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,500;9..144,0,600;9..144,1,400;9..144,1,500&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#eef4ee; --ground2:#e2ebe2; --panel:#f5f9f5;
    --pane:rgba(255,255,255,.46); --pane-strong:rgba(255,255,255,.66);
    --mullion:rgba(90,110,92,.16); --hair:rgba(50,65,52,.11);
    --ink:#1c2a1f; --muted:#54695a; --muted2:#84988a;
    --brass:#4f8ab8; --brass-bright:#8bc6ef; --brass-ink:#ffffff;
    --verdigris:#3e9462; --slate:#4569a2; --teal:#2f8e93; --plum:#93509f; --clay:#b85a3c;
    --water:#2f8e93; --caffeine:var(--brass); --food:#3e9462; --bath:#5e7466;
    --blur:20px;
    --glass-sheen:inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(255,255,255,.15), 0 14px 34px -18px rgba(30,50,35,.28);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--ground); }
  body{
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
    font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
    max-width:480px; margin-inline:auto; padding:22px 18px 70px; position:relative; isolation:isolate;
  }
  /* soft daylight blobs, diffused — the glass panels pick this up when blurred */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(34% 26% at 10% 6%, rgba(150,205,165,.6), transparent 68%),
      radial-gradient(30% 24% at 94% 10%, rgba(140,195,230,.55), transparent 68%),
      radial-gradient(36% 28% at 84% 82%, rgba(170,150,205,.42), transparent 68%),
      radial-gradient(32% 26% at 6% 88%, rgba(140,195,205,.48), transparent 68%),
      var(--ground);
    filter:blur(46px) saturate(120%);
  }
  /* crisp greenhouse mullion grid, sits above the blur, below the panels */
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, transparent 0 61px, var(--mullion) 61px 62px),
      repeating-linear-gradient(90deg, transparent 0 61px, var(--mullion) 61px 62px);
  }
  h1,h2,h3{ margin:0; font-weight:500; }
  ::selection{ background:var(--brass); color:var(--brass-ink); }

  /* ── header ── */
  .eyebrow{ display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--brass); margin-bottom:10px; }
  .eyebrow .r{ color:var(--muted2); }
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:3px; }
  .wordmark{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:29px; letter-spacing:-.01em; }
  .wordmark b{ font-style:normal; color:var(--brass-bright); font-weight:500; }
  .today-date{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); text-align:right; }
  .greet{ font-family:'Fraunces',serif; font-style:italic; color:var(--muted); font-size:14.5px; margin:2px 0 20px; }

  /* ── ledger tabs ── */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--hair); margin-bottom:22px; }
  .tab{ flex:1; background:none; border:none; padding:0 0 11px; font-family:'Schibsted Grotesk'; font-weight:600;
    font-size:13.5px; letter-spacing:.03em; color:var(--muted2); cursor:pointer; position:relative; text-transform:uppercase; }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--brass); }
  .panel{ display:none; animation:fade .35s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ── growth plate ── */
  .plate{ text-align:center; margin-bottom:6px; }
  .plate svg{ width:100%; max-width:220px; height:176px; }
  .plate-cap{ font-family:'Fraunces',serif; font-style:italic; font-size:13.5px; color:var(--muted); margin-top:-4px; }
  .sprout{ transform-origin:center bottom; transition:opacity .6s ease, transform .6s cubic-bezier(.34,1.4,.6,1); }
  .sprout.dormant{ opacity:0; transform:scale(.3) translateY(6px); }
  #stem{ transition:stroke-dashoffset 1.1s cubic-bezier(.5,0,.2,1); }

  /* ── tag stat row ── */
  .tags-row{ display:flex; justify-content:center; gap:10px; margin:14px 0 24px; flex-wrap:wrap; min-height:10px; }
  .stat-tag{ position:relative; background:var(--pane); border:1px solid var(--hair); border-radius:4px 4px 14px 14px;
    padding:10px 16px 9px; text-align:center; min-width:84px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .stat-tag::before{ content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:6px; height:6px;
    border-radius:50%; background:var(--ground); border:1px solid var(--mullion); }
  .stat-tag .n{ font-size:19px; font-weight:500; }
  .stat-tag .l{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

  /* ── section label ── */
  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted2); margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--hair); }

  /* ── quick-log grid ── */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px; }
  .spec-tag{ background:var(--pane); border:1px solid var(--hair); border-radius:4px 16px 16px 16px; padding:13px 14px;
    display:flex; align-items:center; gap:11px; cursor:pointer; text-align:left; color:var(--ink);
    font-family:'Schibsted Grotesk'; position:relative; transition:transform .08s, border-color .15s, background .15s;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .spec-tag:active{ transform:scale(.96); }
  .spec-tag .badge{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:var(--ground2); border:1px solid var(--mullion); flex-shrink:0; }
  .spec-tag .txt{ display:flex; flex-direction:column; line-height:1.3; min-width:0; }
  .spec-tag .lbl{ font-weight:600; font-size:14px; }
  .spec-tag .sub{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .spec-tag .del{ position:absolute; top:5px; right:8px; font-size:12px; color:var(--clay); opacity:0; padding:3px; }
  .spec-tag.editing .del{ opacity:.9; }
  .add-tag{ border:1px dashed var(--mullion); border-radius:4px 16px 16px 16px; background:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Schibsted Grotesk'; font-size:13.5px; cursor:pointer; padding:13px; }
  .toolbar{ display:flex; justify-content:flex-end; margin:-8px 0 10px; }
  .toolbar button{ background:none; border:none; color:var(--muted2); font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.04em; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ── field note (AI box) ── */
  .fieldnote{ display:flex; gap:8px; margin-bottom:14px; }
  .fieldnote input{ flex:1; background:var(--pane); border:1px solid var(--hair); border-radius:12px; padding:13px 15px;
    color:var(--ink); font-family:'Fraunces',serif; font-style:italic; font-size:14.5px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .fieldnote input::placeholder{ color:var(--muted2); }
  .fieldnote input:focus{ outline:none; border-color:var(--brass); }
  .brass-btn{ background:var(--brass); color:var(--brass-ink); border:none; border-radius:12px; padding:0 18px;
    font-family:'Schibsted Grotesk'; font-weight:700; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
  .brass-btn:disabled{ opacity:.45; cursor:default; }
  .index-card{ background:var(--pane-strong); border:1px solid var(--mullion); border-radius:4px 18px 18px 18px;
    padding:18px; margin-bottom:20px; animation:fade .3s ease;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .index-card .sum{ font-family:'Fraunces',serif; font-style:italic; font-size:18px; margin-bottom:2px; text-transform:capitalize; }
  .index-card .hint{ font-size:11px; color:var(--muted2); margin-bottom:14px; }
  .leader{ display:flex; align-items:baseline; gap:8px; margin:9px 0; }
  .leader .lb{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .leader .fill{ flex:1; border-bottom:1px dotted var(--mullion); margin-bottom:4px; min-width:8px; }
  .leader input{ width:56px; background:none; border:none; color:var(--ink); font-family:'IBM Plex Mono',monospace;
    font-size:14px; text-align:right; }
  .leader input:focus{ outline:none; color:var(--brass); }
  .leader .u{ font-size:11px; color:var(--muted2); min-width:26px; }
  .card-actions{ display:flex; gap:10px; margin-top:16px; }
  .card-actions .save{ flex:1; }
  .ghost-btn{ background:none; border:1px solid var(--hair); color:var(--muted); border-radius:12px; padding:11px 16px;
    font-family:'Schibsted Grotesk'; font-size:13px; cursor:pointer; }

  .macros-rule{ display:flex; justify-content:space-between; padding:11px 4px; margin-bottom:22px; border-top:1px solid var(--hair);
    border-bottom:1px solid var(--hair); font-size:11.5px; color:var(--muted); }
  .macros-rule b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:500; }

  /* ── ledger list ── */
  .ledger{ list-style:none; margin:0 0 14px; padding:4px 12px; background:var(--pane); border:1px solid var(--hair); border-radius:6px 18px 18px 18px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .ledger li{ display:flex; align-items:center; gap:11px; padding:11px 2px; border-bottom:1px solid var(--hair); animation:fade .3s ease; }
  .ledger li:last-child{ border-bottom:none; }
  .ledger .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .ledger .lbl{ flex:1; font-size:14px; text-transform:capitalize; }
  .ledger .det{ font-size:11.5px; color:var(--muted); }
  .ledger .time{ font-size:11.5px; color:var(--muted2); font-family:'IBM Plex Mono',monospace; min-width:64px; text-align:right; }
  .empty{ color:var(--muted2); font-style:italic; font-family:'Fraunces',serif; text-align:center; padding:20px 0; font-size:14px; }

  .strike{ width:100%; background:none; border:1px dashed var(--hair); color:var(--muted2); border-radius:12px; padding:10px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; cursor:pointer; text-transform:uppercase; }
  .strike:disabled{ opacity:.35; cursor:default; }

  /* ── sleep specimen ── */
  .sleep-card{ background:var(--pane); border:1px solid var(--hair); border-radius:6px 20px 20px 20px; padding:20px; margin-bottom:18px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .sleep-top{ display:flex; gap:18px; align-items:center; }
  .ring-wrap{ position:relative; width:112px; height:112px; flex-shrink:0; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-c .big{ font-family:'IBM Plex Mono',monospace; font-size:21px; }
  .ring-c .sub{ font-size:10px; color:var(--muted); font-style:italic; font-family:'Fraunces',serif; margin-top:2px; }
  .sleep-meta{ flex:1; min-width:0; }
  .sleep-meta .when{ font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--muted); margin-bottom:10px; }
  .stage-leader{ display:flex; align-items:baseline; gap:6px; font-size:12px; margin:6px 0; }
  .stage-leader .dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; }
  .stage-leader .nm{ color:var(--muted); white-space:nowrap; }
  .stage-leader .fill{ flex:1; border-bottom:1px dotted var(--hair); margin-bottom:3px; }
  .stage-leader .vv{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; }

  /* ── vitals ── */
  .vitals{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:24px; }
  .vital-tag{ background:var(--pane); border:1px solid var(--hair); border-radius:4px 14px 14px 14px; padding:12px; text-align:center;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .vital-tag .v{ font-family:'IBM Plex Mono',monospace; font-size:19px; }
  .vital-tag .u{ font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
  .vital-tag.hr .v{ color:var(--clay); } .vital-tag.steps .v{ color:var(--verdigris); } .vital-tag.spo2 .v{ color:var(--teal); }
  .vital-tag .v.none{ color:var(--muted2); font-size:16px; }
  .vital-tag .spark{ margin-top:7px; height:18px; width:100%; }

  /* ── herbarium calendar ── */
  .plate-card{ background:var(--pane); border:1px solid var(--hair); border-radius:6px 20px 20px 20px; padding:18px; margin-bottom:20px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); }
  .plate-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .plate-head .cap{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; }
  .plate-nav{ display:flex; gap:5px; }
  .plate-nav button{ width:26px; height:26px; border-radius:50%; border:1px solid var(--mullion); background:none;
    color:var(--brass); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .plate-nav button:disabled{ opacity:.25; cursor:default; }
  .plate-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted2); letter-spacing:.06em; margin-bottom:14px; }
  .dow-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .dow-row span{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted2); text-align:center; }
  .herb-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .herb-cell{ aspect-ratio:1; border-radius:3px; border:1px solid var(--hair); background:rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; position:relative; font-size:11px; color:var(--muted2);
    font-family:'IBM Plex Mono',monospace; }
  .herb-cell.pad{ visibility:hidden; }
  .herb-cell.has{ cursor:pointer; color:var(--ink); }
  .herb-cell.has:active{ transform:scale(.9); }
  .herb-cell.today{ border-color:var(--brass); }
  .herb-cell.sel{ outline:1px solid var(--brass); outline-offset:1px; }
  .herb-cell .sd{ position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--plum); }
  .legend{ display:flex; align-items:center; justify-content:center; gap:7px; margin-top:13px; font-size:9.5px; color:var(--muted2);
    font-family:'IBM Plex Mono',monospace; flex-wrap:wrap; }
  .legend .sw{ display:flex; gap:2px; }
  .legend .sw i{ width:10px; height:10px; border-radius:2px; display:inline-block; border:1px solid var(--hair); }
  .plate-detail{ margin-top:16px; padding-top:15px; border-top:1px solid var(--hair); }
  .plate-detail .dt{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; margin-bottom:11px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; }
  .detail-grid .leader .lb{ font-size:11.5px; }
  .detail-grid .leader .vv{ font-family:'IBM Plex Mono',monospace; font-size:13px; }

  /* ── modal ── */
  .modal-bg{ position:fixed; inset:0; background:rgba(4,8,6,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--pane-strong); border:1px solid var(--mullion); border-radius:6px 22px 22px 22px; padding:22px; width:100%; max-width:380px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%); backdrop-filter:blur(var(--blur)) saturate(160%); box-shadow:var(--glass-sheen); max-height:88vh; overflow-y:auto; }
  .modal h3{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; margin:0 0 16px; font-size:18px; }
  .modal label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:12px 0 5px; }
  .modal input, .modal select{ width:100%; background:var(--pane); border:1px solid var(--hair); border-radius:8px; padding:10px 12px;
    color:var(--ink); font-family:'Schibsted Grotesk'; font-size:14px; }
  .modal input[type=color]{ height:42px; padding:4px; }
  .modal .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal .actions-row{ display:flex; gap:10px; margin-top:20px; }
  .modal .actions-row .brass-btn{ flex:1; padding:12px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
</style>
</head>
<body>
  <div class="eyebrow"><span id="eyebrow-l"></span><span class="r">TODAY</span></div>
  <header>
    <div class="wordmark">Thal<b>lo</b></div>
    <div class="today-date" id="today-date"></div>
  </header>
  <div class="greet" id="greet"></div>

  <div class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="readings" onclick="switchTab('readings')">Readings</button>
  </div>

  <!-- ═══ TODAY ═══ -->
  <section class="panel active" id="panel-today">
    <div class="plate">
      <svg viewBox="0 0 200 240" aria-label="Today's growth">
        <path d="M54 228 Q100 220 146 228" stroke="var(--hair)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path id="stem" d="M100 228 C 97 196, 103 172, 99 144 C 96 118, 102 92, 100 64 C 99 52, 100 44, 100 38" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
        <g id="sprouts">
          <g class="sprout dormant" data-i="0"><path d="M99 200 C 80 196, 67 202, 60 214 C 75 214, 90 210, 99 200 Z" fill="none" stroke="var(--water)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="1"><path d="M100 184 C 119 180, 132 186, 139 198 C 124 198, 109 194, 100 184 Z" fill="none" stroke="var(--water)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="2"><path d="M99 158 C 78 153, 64 160, 57 173 C 74 173, 90 168, 99 158 Z" fill="none" stroke="var(--caffeine)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="3"><path d="M100 140 C 121 135, 135 142, 142 155 C 126 155, 110 150, 100 140 Z" fill="none" stroke="var(--food)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="4"><path d="M99 116 C 78 111, 63 118, 56 131 C 74 131, 90 126, 99 116 Z" fill="none" stroke="var(--food)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="5"><path d="M100 96 C 120 91, 134 98, 141 111 C 125 111, 110 106, 100 96 Z" fill="none" stroke="var(--caffeine)" stroke-width="1.3"/></g>
          <g class="sprout dormant" data-i="6">
            <circle cx="100" cy="40" r="12" fill="var(--brass)"/><circle cx="100" cy="40" r="5" fill="var(--ground)"/>
          </g>
        </g>
      </svg>
      <div class="plate-cap" id="plate-cap">a fresh page to tend</div>
    </div>

    <div class="tags-row" id="tallies"></div>

    <div class="toolbar"><button id="editToggle" onclick="toggleEdit()">Edit specimens</button></div>
    <div class="grid" id="actions"></div>

    <p class="section-label">Field note</p>
    <div class="fieldnote">
      <input id="ai-text" type="text" placeholder="Describe a meal or drink…" autocomplete="off">
      <button class="brass-btn" id="ai-btn" onclick="estimate()">Estimate</button>
    </div>
    <div id="ai-result"></div>

    <div class="macros-rule" id="macros" hidden>
      <span><b id="m-cal">0</b> cal</span><span><b id="m-protein">0</b>g protein</span>
      <span><b id="m-sugar">0</b>g sugar</span><span><b id="m-salt">0</b>g salt</span>
    </div>

    <p class="section-label">Today's entries</p>
    <ul class="ledger" id="log"></ul>
    <button class="strike" id="undo" onclick="undo()" disabled>Strike last entry</button>
  </section>

  <!-- ═══ READINGS ═══ -->
  <section class="panel" id="panel-readings">
    <p class="section-label">Last night</p>
    <div class="sleep-card" id="sleepCard"></div>

    <p class="section-label">Vitals</p>
    <div class="vitals">
      <div class="vital-tag hr"><div class="v" id="v-hr">–</div><div class="u">resting bpm</div><svg class="spark" id="spark-hr" viewBox="0 0 80 18" preserveAspectRatio="none"></svg></div>
      <div class="vital-tag steps"><div class="v" id="v-steps">–</div><div class="u">steps</div><svg class="spark" id="spark-steps" viewBox="0 0 80 18" preserveAspectRatio="none"></svg></div>
      <div class="vital-tag spo2"><div class="v" id="v-spo2">–</div><div class="u">avg SpO₂</div></div>
    </div>

    <p class="section-label">Growth chart</p>
    <div class="plate-card">
      <div class="plate-head">
        <div class="plate-nav"><button id="calPrev" onclick="calShift(-1)">‹</button></div>
        <div class="cap" id="calMonth"></div>
        <div class="plate-nav"><button id="calNext" onclick="calShift(1)">›</button></div>
      </div>
      <div class="plate-sub" id="calSub">RECORDED FROM WEARABLE SYNC</div>
      <div class="dow-row"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="herb-grid" id="calGrid"></div>
      <div class="legend">
        <span>steps</span>
        <span class="sw"><i style="background:rgba(62,148,98,.15)"></i><i style="background:rgba(62,148,98,.4)"></i><i style="background:rgba(62,148,98,.65)"></i><i style="background:rgba(62,148,98,.9)"></i></span>
        <span>more</span>
        <span style="display:flex;align-items:center;gap:4px;margin-left:6px;"><i style="width:6px;height:6px;border-radius:50%;background:var(--plum);display:inline-block;border:none;"></i>sleep logged</span>
      </div>
      <div class="plate-detail" id="calDetail" hidden></div>
    </div>
  </section>

  <div class="modal-bg" id="modalBg"><div class="modal">
    <h3>New specimen</h3>
    <label>Label</label><input id="f-label" placeholder="e.g. Energy drink">
    <div class="grid2"><div><label>Icon</label><input id="f-icon" placeholder="⚡" maxlength="4"></div>
      <div><label>Category</label><input id="f-type" placeholder="e.g. caffeine"></div></div>
    <div class="grid2"><div><label>Value (blank = none)</label><input id="f-value" type="number" min="0" placeholder="160"></div>
      <div><label>Unit</label><input id="f-unit" placeholder="mg"></div></div>
    <div class="grid2"><div><label>Totals as</label><select id="f-agg"><option value="count">Count taps</option><option value="sum">Sum values</option></select></div>
      <div><label>Show counter?</label><select id="f-tally"><option value="true">Yes</option><option value="false">No</option></select></div></div>
    <label>Colour</label><input id="f-color" type="color" value="#4f8ab8">
    <div class="actions-row"><button class="brass-btn" onclick="saveShortcut()">Create</button><button class="ghost-btn" onclick="closeModal()">Cancel</button></div>
  </div></div>

<script>
  const WATER_GOAL=2000, CAFFEINE_CAP=400, MEAL_GOAL=3;
  let lastId=null, pendingText='', shortcuts=[], editMode=false;

  function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function pick(obj,keys){ for(const k of keys){const v=obj[k]; if(v!==undefined&&v!==null&&v!=='') return Number(v)||0;} return 0; }
  function hm(mins){ if(mins==null) return '–'; const h=Math.floor(mins/60), m=mins%60; return h+':'+String(m).padStart(2,'0'); }
  function clock(iso){ if(!iso) return ''; const d=new Date(iso.replace(' ','T')+'Z'); return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
  function romanYear(y){ const map=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    let n=y, out=''; for(const [v,s] of map){ while(n>=v){ out+=s; n-=v; } } return out; }
  function dayOfYear(d){ const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/864e5); }
  function isToday(d){ const n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }

  const now=new Date();
  document.getElementById('eyebrow-l').textContent='Specimen No. '+dayOfYear(now);
  document.getElementById('today-date').textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const h=now.getHours();
  const tod = h<6?'night':h<11?'morning':h<17?'midday':h<21?'evening':'night';
  const greetings={morning:'A fresh page to tend.', midday:'Steady growth, noted.', evening:'The light is softening.', night:'Quiet hours in the glasshouse.'};
  document.getElementById('greet').textContent=greetings[tod];
  function plateCapText(active){ if(!active) return tod==='morning'?'a fresh page to tend':tod==='night'?'quiet hours':'nothing planted yet'; return 'growing well'; }

  function switchTab(name){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
  }

  // ── sleep + vitals from /daily ──
  async function loadDaily(){
    let days=[];
    try { days = await (await fetch('/daily')).json(); } catch(e){ return; }
    const card=document.getElementById('sleepCard');
    const night = days.find(d => d.sleepTotal && d.sleepTotal>0);
    if(!night){
      card.innerHTML = '<div class="empty">No sleep recorded yet. Wear the band overnight.</div>';
    } else {
      const stages=[['Deep','var(--slate)',night.sleepDeep],['Light','var(--teal)',night.sleepLight],['REM','var(--plum)',night.sleepRem],['Awake','var(--brass)',night.sleepAwake]];
      const total=stages.reduce((a,s)=>a+(s[2]||0),0)||1;
      const R=48,C=2*Math.PI*R,gap=3; let off=0,seg='';
      seg+='<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="var(--ground2)" stroke-width="10"/>';
      stages.forEach(s=>{ const mins=s[2]||0; if(mins<=0) return; const len=(mins/total)*C-gap;
        seg+='<circle cx="56" cy="56" r="'+R+'" fill="none" stroke="'+s[1]+'" stroke-width="10" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" stroke-linecap="round"/>';
        off+=(mins/total)*C; });
      const rows=stages.map(s=>'<div class="stage-leader"><span class="dot" style="background:'+s[1]+'"></span><span class="nm">'+s[0]+'</span><span class="fill"></span><span class="vv">'+hm(s[2])+'</span></div>').join('');
      card.innerHTML =
        '<div class="sleep-top"><div class="ring-wrap"><svg width="112" height="112" viewBox="0 0 112 112">'+seg+'</svg>'+
        '<div class="ring-c"><span class="big">'+hm(night.sleepTotal)+'</span><span class="sub">asleep</span></div></div>'+
        '<div class="sleep-meta"><div class="when">'+clock(night.sleepStart)+' → '+clock(night.sleepEnd)+'</div>'+rows+'</div></div>';
    }
    const latest = days[0] || {};
    setVital('v-hr', latest.restingHr, '');
    setVital('v-steps', latest.steps!=null ? (latest.steps>=1000?(latest.steps/1000).toFixed(1)+'k':latest.steps) : null, '');
    setVital('v-spo2', latest.avgSpo2, '');
    const chrono=[...days].reverse();
    sparkline('spark-hr', chrono.map(d=>d.restingHr).filter(v=>v!=null), 'var(--clay)');
    sparkline('spark-steps', chrono.map(d=>d.steps).filter(v=>v!=null), 'var(--verdigris)');
  }
  function setVital(id,val,unit){ const el=document.getElementById(id);
    if(val==null||val===0){ el.textContent='–'; el.classList.add('none'); } else { el.textContent=val+unit; el.classList.remove('none'); } }
  function sparkline(id,pts,color){ const el=document.getElementById(id); if(!el) return;
    if(pts.length<2){ el.innerHTML=''; return; }
    const max=Math.max(...pts),min=Math.min(...pts);
    const d=pts.map((p,i)=>{ const x=(i/(pts.length-1))*80; const y=18-((p-min)/(max-min||1))*14-2; return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
    el.innerHTML=`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }

  async function loadShortcuts(){
    shortcuts = await (await fetch('/shortcuts')).json();
    const wrap=document.getElementById('actions');
    wrap.innerHTML = shortcuts.map(s=>{ const sub=s.value!=null?'<span class="sub">'+s.value+(s.unit||'')+'</span>':'';
      return '<button class="spec-tag" onclick="tapShortcut('+s.id+')"><span class="del" onclick="event.stopPropagation();delShortcut('+s.id+')">✕</span>'+
        '<span class="badge">'+(s.icon||'•')+'</span><span class="txt"><span class="lbl">'+esc(s.label)+'</span>'+sub+'</span></button>';
    }).join('') + '<button class="add-tag" onclick="openModal()"><span style="font-size:17px">+</span> Add specimen</button>';
    if(editMode) wrap.querySelectorAll('.spec-tag').forEach(b=>b.classList.add('editing'));
  }
  function tapShortcut(id){ if(editMode) return; const s=shortcuts.find(x=>x.id===id); if(!s) return; log(s.type, s.value??null, s.label.toLowerCase()); }

  async function log(type,value,message){
    try{ const res=await fetch('/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,value,message})});
      const entry=await res.json(); lastId=entry.id; document.getElementById('undo').disabled=false;
      if(navigator.vibrate)navigator.vibrate(8); await loadLogs();
    }catch(e){ alert('Could not reach Thallo - is the laptop awake?'); }
  }
  async function undo(){ if(lastId==null) return; await fetch('/log/'+lastId,{method:'DELETE'}); lastId=null; document.getElementById('undo').disabled=true; await loadLogs(); }

  function toggleEdit(){ editMode=!editMode; document.getElementById('editToggle').textContent=editMode?'Done':'Edit specimens'; document.querySelectorAll('.spec-tag').forEach(b=>b.classList.toggle('editing',editMode)); }
  function openModal(){ document.getElementById('modalBg').classList.add('open'); }
  function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
  async function delShortcut(id){ if(!confirm('Remove this specimen?')) return; await fetch('/shortcuts/'+id,{method:'DELETE'}); await loadShortcuts(); }
  async function saveShortcut(){
    const label=document.getElementById('f-label').value.trim();
    const type=document.getElementById('f-type').value.trim()||label.toLowerCase();
    if(!label){ alert('Give it a label'); return; }
    const valRaw=document.getElementById('f-value').value;
    const body={ label, type, icon:document.getElementById('f-icon').value.trim()||'•',
      value:valRaw===''?null:Math.max(0,Number(valRaw)), unit:document.getElementById('f-unit').value.trim()||null,
      color:document.getElementById('f-color').value, aggregation:document.getElementById('f-agg').value,
      showTally:document.getElementById('f-tally').value==='true', sortOrder:100 };
    await fetch('/shortcuts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeModal(); ['f-label','f-icon','f-type','f-value','f-unit'].forEach(id=>document.getElementById(id).value=''); await loadShortcuts();
  }

  async function estimate(){
    const input=document.getElementById('ai-text'); const text=input.value.trim(); if(!text) return;
    const btn=document.getElementById('ai-btn'); btn.disabled=true; btn.textContent='…';
    try{ const res=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      const data=await res.json(); pendingText=text;
      showResult({summary:data.summary||text,calories:pick(data,['calories','cal','kcal']),protein:pick(data,['protein_g','protein']),sugar:pick(data,['sugar_g','sugar']),salt:pick(data,['salt_g','salt','sodium_g']),caffeine:pick(data,['caffeine_mg','caffeine'])});
    }catch(e){ alert('Could not estimate - is the laptop awake?'); } finally{ btn.disabled=false; btn.textContent='Estimate'; }
  }
  function fieldRow(id,label,value,unit){ return '<div class="leader"><span class="lb">'+label+'</span><span class="fill"></span>'+
    '<input id="'+id+'" type="number" min="0" inputmode="decimal" value="'+value+'" oninput="if(this.value<0)this.value=0"><span class="u">'+unit+'</span></div>'; }
  function showResult(d){ const box=document.getElementById('ai-result'); box.hidden=false;
    box.innerHTML='<div class="index-card"><div class="sum">'+esc(d.summary)+'</div><div class="hint">Adjust any figure before filing.</div>'+
      fieldRow('e-cal','Calories',d.calories,'cal')+fieldRow('e-protein','Protein',d.protein,'g')+fieldRow('e-sugar','Sugar',d.sugar,'g')+fieldRow('e-salt','Salt',d.salt,'g')+fieldRow('e-caffeine','Caffeine',d.caffeine,'mg')+
      '<div class="card-actions"><button class="brass-btn save" onclick="savePending()">File entry</button><button class="ghost-btn" onclick="cancelPending()">Discard</button></div></div>';
  }
  function cancelPending(){ pendingText=''; document.getElementById('ai-result').innerHTML=''; document.getElementById('ai-text').value=''; }
  function val(id){ const el=document.getElementById(id); return el?Math.max(0,Number(el.value)||0):0; }
  async function savePending(){
    if(!pendingText) return;
    const cal=val('e-cal'),pr=val('e-protein'),su=val('e-sugar'),sa=val('e-salt'),ca=val('e-caffeine');
    await fetch('/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'food',message:pendingText,calories:cal,protein:pr,sugar:su,salt:sa})});
    if(ca>0) await fetch('/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'caffeine',value:ca,message:pendingText})});
    cancelPending(); if(navigator.vibrate)navigator.vibrate(8); await loadLogs();
  }

  function growPlant(totals){
    const wat=totals['water']?.sum||0, caf=totals['caffeine']?.sum||0, meals=totals['food']?.count||0;
    const wF=Math.min(1,wat/WATER_GOAL), mF=Math.min(1,meals/MEAL_GOAL);
    const lit=[wF>=0.25,wF>=0.6,caf>0,meals>=1,meals>=2,caf>=160]; const bloom=(wF>=0.6&&mF>=0.66);
    const overall=(wF+mF+Math.min(1,caf/CAFFEINE_CAP))/3;
    // the stem must grow at least as far as the highest lit leaf's position on the path,
    // otherwise a leaf can light up above where the line has actually drawn to
    const reach=[0.14,0.24,0.38,0.48,0.60,0.70];
    let needed=0; lit.forEach((on,i)=>{ if(on) needed=Math.max(needed,reach[i]); });
    if(bloom) needed=1;
    const stem=document.getElementById('stem'); const len=stem.getTotalLength();
    stem.style.strokeDasharray=len; stem.style.strokeDashoffset=len*(1-Math.max(0.18,overall,needed));
    document.querySelectorAll('.sprout').forEach(el=>{ const i=+el.dataset.i; el.classList.toggle('dormant',!(i<=5?lit[i]:bloom)); });
  }

  async function loadLogs(){
    const entries=await (await fetch('/logs')).json();
    const aggOf={}; shortcuts.forEach(s=>{aggOf[s.type]=s.aggregation;});
    const totals={}; let cal=0,protein=0,sugar=0,salt=0;
    entries.forEach(e=>{ const d=new Date(e.timestamp+'Z'); if(!isToday(d)) return; const t=e.type;
      if(!totals[t]) totals[t]={sum:0,count:0}; totals[t].sum+=e.value||0; totals[t].count+=1;
      if(t==='food'){cal+=pick(e,['calories']);protein+=pick(e,['protein']);sugar+=pick(e,['sugar']);salt+=pick(e,['salt']);} });
    const seen={}; const tallyHtml=[];
    shortcuts.forEach(s=>{ if(!s.showTally||seen[s.type]) return; seen[s.type]=true; const tt=totals[s.type]||{sum:0,count:0};
      const isSum=(aggOf[s.type]==='sum'); const n=isSum?tt.sum:tt.count; const lbl=isSum&&s.unit?s.unit+' '+s.type:s.type;
      tallyHtml.push('<div class="stat-tag"><div class="n" style="color:'+s.color+'">'+n+'</div><div class="l">'+esc(lbl)+'</div></div>'); });
    document.getElementById('tallies').innerHTML=tallyHtml.join('');
    const anyActivity=Object.keys(totals).length>0;
    document.getElementById('plate-cap').textContent=plateCapText(anyActivity); growPlant(totals);
    document.getElementById('m-cal').textContent=Math.round(cal); document.getElementById('m-protein').textContent=Math.round(protein);
    document.getElementById('m-sugar').textContent=Math.round(sugar); document.getElementById('m-salt').textContent=Math.round(salt);
    document.getElementById('macros').hidden=(cal+protein+sugar+salt===0);
    const colorOf={}; shortcuts.forEach(s=>{colorOf[s.type]=s.color;});
    const ul=document.getElementById('log');
    if(!entries.length){ ul.innerHTML='<div class="empty">The page is unwritten.</div>'; return; }
    ul.innerHTML=entries.map(e=>{ const d=new Date(e.timestamp+'Z'); const t=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
      const label=e.message||e.type; let detail='';
      if(e.type==='food'){ const p=[]; if(e.calories)p.push(e.calories+' cal'); if(e.protein)p.push(e.protein+'g protein'); if(e.sugar)p.push(e.sugar+'g sugar'); if(e.salt)p.push(e.salt+'g salt'); detail=p.length?'<span class="det">'+p.join(' · ')+'</span>':''; }
      else if(e.value!=null){ detail='<span class="det">'+e.value+'</span>'; }
      const c=colorOf[e.type]||'var(--muted2)';
      return '<li><span class="dot" style="background:'+c+'"></span><span class="lbl">'+esc(label)+'</span>'+detail+'<span class="time">'+t+'</span></li>';
    }).join('');
  }

  // ── herbarium calendar of imported Gadgetbridge data ──
  let calData={}, calYear, calMonth, calSelKey=null;
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function firstWeekdayMon(y,m){ return (new Date(y,m,1).getDay()+6)%7; }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function stepsBucket(steps){ if(steps==null) return 0; if(steps<2000) return 1; if(steps<5000) return 2; if(steps<8000) return 3; return 4; }
  const bucketColor=['','rgba(62,148,98,.15)','rgba(62,148,98,.4)','rgba(62,148,98,.65)','rgba(62,148,98,.9)'];

  async function loadCalendar(){
    let all=[];
    try { all = await (await fetch('/daily/all')).json(); } catch(e){ return; }
    calData={};
    all.forEach(d=>{ const key=(d.date||'').slice(0,10); if(key) calData[key]=d; });
    const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth();
    renderCalendar();
  }
  function calShift(delta){
    calMonth+=delta;
    if(calMonth<0){calMonth=11;calYear--;} else if(calMonth>11){calMonth=0;calYear++;}
    calSelKey=null; renderCalendar();
  }
  function renderCalendar(){
    document.getElementById('calMonth').textContent=MONTHS[calMonth]+' '+calYear;
    document.getElementById('calSub').textContent='PLATE '+(calMonth+1)+' · '+romanYear(calYear);
    const pad=firstWeekdayMon(calYear,calMonth), dim=daysInMonth(calYear,calMonth);
    const today=new Date();
    let html='';
    for(let i=0;i<pad;i++) html+='<div class="herb-cell pad"></div>';
    for(let day=1; day<=dim; day++){
      const key=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const rec=calData[key]; const hasData=!!rec;
      const isTod=today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===day;
      const bucket=hasData?stepsBucket(rec.steps):0;
      const style=bucket?' style="background:'+bucketColor[bucket]+';"':'';
      const sleepDot=(hasData && rec.sleepTotal)?'<span class="sd"></span>':'';
      html+='<div class="herb-cell'+(hasData?' has':'')+(isTod?' today':'')+(key===calSelKey?' sel':'')+'"'+style+(hasData?' onclick="showCalDetail(\''+key+'\')"':'')+'>'+day+sleepDot+'</div>';
    }
    document.getElementById('calGrid').innerHTML=html;
    const n=new Date();
    document.getElementById('calNext').disabled=(calYear===n.getFullYear() && calMonth===n.getMonth());
    document.getElementById('calDetail').hidden=true;
  }
  function showCalDetail(key){
    const rec=calData[key]; if(!rec) return; calSelKey=key; renderCalendar();
    const box=document.getElementById('calDetail'); box.hidden=false;
    const when=new Date(key+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    const rows=[
      ['Steps',rec.steps!=null?rec.steps:'–'],
      ['Asleep',rec.sleepTotal!=null?hm(rec.sleepTotal):'–'],
      ['Resting bpm',rec.restingHr!=null?rec.restingHr:'–'],
      ['Avg SpO₂',rec.avgSpo2!=null?rec.avgSpo2:'–'],
      ['Active cal',rec.calories!=null?rec.calories:'–'],
      ['Avg stress',rec.avgStress!=null?rec.avgStress:'–'],
    ];
    box.innerHTML='<div class="dt">'+when+'</div><div class="detail-grid">'+
      rows.map(r=>'<div class="leader"><span class="lb">'+r[0]+'</span><span class="fill"></span><span class="vv">'+r[1]+'</span></div>').join('')+'</div>';
  }

  document.getElementById('ai-text').addEventListener('keydown',e=>{ if(e.key==='Enter') estimate(); });
  (async function(){ await loadShortcuts(); await loadLogs(); await loadDaily(); await loadCalendar(); })();
</script>
</body>
</html>
